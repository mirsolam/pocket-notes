services:
    react-web:
        working_dir: /app
        build: 
            context: .
            dockerfile: Dockerfile
            args:
                VITE_APP_API_URL: http://localhost:3500
        image: pocket-notes-frontend:latest
        stdin_open: true
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: 3100
        ports:
            - "127.0.0.1:3100:3100"
        depends_on:
            - node-backend
        restart: unless-stopped


    node-backend:
        working_dir: /app/backend
        build: 
            context: ./backend
            dockerfile: Dockerfile
        image: pocket-notes-backend:latest
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: 3500
        ports:
            - "127.0.0.1:3500:3500"
        volumes:
            - sqlite_data:/data
        restart: unless-stopped

volumes:
    sqlite_data:
        driver: local
